<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>需求总表提醒测试</title>
  <link rel="stylesheet" href="./demand-monitor-test.css?v=0.1.8">
</head>
<body>
  <main class="monitor-shell">
    <header class="monitor-header">
      <div>
        <h1>需求总表提醒测试</h1>
        <p id="summaryText">等待扫描</p>
      </div>
      <span class="version-badge">v0.1.8</span>
    </header>

    <section class="toolbar" aria-label="测试操作">
      <button id="scanButton" class="primary-action" type="button">扫描总表</button>
      <button id="signalButton" class="secondary-action" type="button">读取变更信号</button>
      <label>
        <span>项目</span>
        <select id="projectFilterInput">
          <option value="highschool" selected>恶魔高校/高校</option>
          <option value="ikki">一骑当千/一骑</option>
          <option value="queen">女王之刃/女王</option>
          <option value="strike">噬血狂袭</option>
          <option value="maou">魔王</option>
          <option value="all">全部项目</option>
        </select>
      </label>
      <label>
        <span>扫描上限</span>
        <input id="limitInput" type="number" min="1" max="5000" step="100" value="2000">
      </label>
      <span id="statusText" class="status-text">未开始</span>
    </section>

    <section class="signal-strip" aria-label="需求总表状态">
      <div>
        <span>文档</span>
        <strong id="docNameText">-</strong>
      </div>
      <div>
        <span>modifyTime</span>
        <strong id="modifyTimeText">-</strong>
      </div>
      <div>
        <span>最后扫描</span>
        <strong id="scanTimeText">-</strong>
      </div>
      <div>
        <span>异常</span>
        <strong id="issueCountText">0</strong>
      </div>
    </section>

    <section id="leaderGrid" class="leader-grid" aria-label="组长测试页面"></section>

    <section id="otherPanel" class="other-panel" hidden>
      <header>
        <strong>其他责任人</strong>
        <span id="otherCountText">0</span>
      </header>
      <div id="otherList" class="task-list"></div>
    </section>
  </main>

  <template id="leaderPanelTemplate">
    <article class="leader-panel">
      <header>
        <div>
          <strong class="leader-role"></strong>
          <span class="leader-name"></span>
        </div>
        <em class="leader-count">0</em>
      </header>
      <div class="task-list"></div>
    </article>
  </template>

  <template id="taskItemTemplate">
    <article class="task-item">
      <div class="task-title-row">
        <strong class="task-title"></strong>
        <span class="task-state"></span>
      </div>
      <dl>
        <div><dt>项目</dt><dd class="task-project"></dd></div>
        <div><dt>类型</dt><dd class="task-type"></dd></div>
        <div><dt>约行号</dt><dd class="task-row-number"></dd></div>
        <div><dt class="missing-label">缺失</dt><dd class="task-missing"></dd></div>
        <div><dt>责任来源</dt><dd class="task-owner-source"></dd></div>
      </dl>
      <div class="task-actions">
        <button class="task-open-master" type="button">定位总表</button>
        <a class="task-link" target="_blank" rel="noreferrer" hidden>需求链接</a>
      </div>
    </article>
  </template>

  <script src="./demand-monitor-test.js?v=0.1.8"></script>
</body>
</html>
