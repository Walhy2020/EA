<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f7f8">
  <title>需求进度管理 - 必填字段处理</title>
  <link rel="stylesheet" href="./watchdog-feedback.css?v=0.1.4">
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <p class="eyebrow">需求进度管理</p>
      <div class="header-line">
        <h1>必填字段处理</h1>
        <span id="statusBadge" class="status-badge">加载中</span>
      </div>
    </header>

    <section id="loadingPanel" class="notice-panel" aria-live="polite">正在读取需求...</section>
    <section id="errorPanel" class="notice-panel error" hidden aria-live="polite"></section>

    <section id="taskPanel" class="task-panel" hidden>
      <h2 id="demandName"></h2>
      <div id="actionGrid" class="action-grid" aria-label="处理状态">
        <button id="processingButton" type="button" data-action="processing">正在处理</button>
        <button id="doneButton" type="button" data-action="done">已完成</button>
      </div>
      <dl class="task-details">
        <div>
          <dt>需求 ID</dt>
          <dd id="demandId" class="task-id-value"></dd>
        </div>
        <div>
          <dt>责任同事</dt>
          <dd id="ownerName"></dd>
        </div>
        <div>
          <dt>所属项目</dt>
          <dd id="projectName"></dd>
        </div>
        <div>
          <dt>缺失字段</dt>
          <dd id="missingFields"></dd>
        </div>
      </dl>
      <div class="feedback-form">
        <button id="refreshButton" type="button">刷新字段</button>
      </div>
      <p id="actionMessage" class="action-message" aria-live="polite"></p>
    </section>

    <footer>需求进度管理 · 必填字段处理 v0.1.4</footer>
  </main>
  <script src="./dev-required-feedback.js?v=0.1.4"></script>
</body>
</html>
