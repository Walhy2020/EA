<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f7f8">
  <title>需求进度管理 - 盯梢反馈</title>
  <link rel="stylesheet" href="./watchdog-feedback.css?v=0.1.6">
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <p class="eyebrow">需求进度管理</p>
      <div class="header-line">
      <h1>盯梢任务反馈</h1>
        <span id="statusBadge" class="status-badge">加载中</span>
      </div>
    </header>

    <section id="loadingPanel" class="notice-panel" aria-live="polite">正在读取盯梢任务...</section>
    <section id="errorPanel" class="notice-panel error" hidden aria-live="polite"></section>

    <section id="taskPanel" class="task-panel" hidden>
      <h2 id="taskContent"></h2>
      <dl class="task-details">
        <div>
          <dt>任务 ID</dt>
          <dd id="taskId" class="task-id-value"></dd>
        </div>
        <div>
          <dt>被盯梢人</dt>
          <dd id="assigneeName"></dd>
        </div>
        <div>
          <dt>发起人</dt>
          <dd id="requesterName"></dd>
        </div>
        <div>
          <dt>盯梢模式</dt>
          <dd id="modeText"></dd>
        </div>
        <div>
          <dt>盯梢时间</dt>
          <dd id="scheduleText"></dd>
        </div>
      </dl>

      <section id="remarkBlock" class="remark-block" hidden>
        <p class="section-label">备注</p>
        <p id="remarkText"></p>
      </section>
      <section id="attachmentBlock" class="remark-block" hidden>
        <p class="section-label">附件</p>
        <p id="attachmentText"></p>
      </section>
      <section id="feedbackHistoryBlock" class="feedback-history" hidden>
        <div class="feedback-history-title">
          <p class="section-label">历史反馈记录</p>
          <span id="feedbackHistoryCount" class="feedback-history-count"></span>
        </div>
        <ol id="feedbackHistoryList" class="feedback-history-list"></ol>
      </section>

      <div id="actionGrid" class="action-grid" aria-label="任务反馈操作">
        <button type="button" data-action="received">收到</button>
        <button type="button" data-action="done">已完成</button>
        <button type="button" data-action="progress">正常推进</button>
        <button type="button" data-action="blocked">遇到困难</button>
        <button type="button" data-action="delay">需要延期</button>
        <button type="button" data-action="reject">拒绝盯梢</button>
      </div>

      <div class="feedback-form">
        <label for="feedbackNote">当前情况说明 <span>选填，拒绝盯梢时必填</span></label>
        <textarea id="feedbackNote" rows="3" maxlength="500" placeholder="简单描述当前进度、困难或延期原因"></textarea>
      </div>

      <p id="actionMessage" class="action-message" aria-live="polite"></p>
    </section>

    <footer>需求进度管理 · EA盯梢反馈 v0.1.6</footer>
  </main>
  <script src="./watchdog-feedback.js?v=0.1.6"></script>
</body>
</html>
