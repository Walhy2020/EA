<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>分配参考 · EA 需求进度管理</title>
  <link rel="icon" href="./assets/ea.png">
  <link rel="stylesheet" href="./styles.css?v=0.2.2">
  <script src="./assets/lucide.min.js" defer></script>
  <script src="./model.js?v=0.2.2" defer></script>
  <script src="./app.js?v=0.2.2" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand"><img src="./assets/ea.png" width="38" height="38" alt="EA"><div><span class="eyebrow">EA 系统</span><h1>需求进度管理</h1></div></div>
    <div class="header-right"><span class="preview-tag">分配参考 <span>v0.2.2</span></span></div>
  </header>
  <div class="preview-strip"><span><i data-lucide="lock-keyhole"></i>只读 · 不写回，不发送通知</span><span id="bridge-status" role="status"></span><button id="refresh" class="icon-button" title="检查数据变化" aria-label="检查数据变化"><i data-lucide="refresh-cw"></i></button><button id="force-refresh" class="icon-button" title="强制重新读取总表" aria-label="强制重新读取总表"><i data-lucide="database-backup"></i></button></div>
  <main class="app-shell">
    <section class="context-bar" aria-label="项目与数据时间">
      <span class="project-select"><i data-lucide="layers-2"></i>分配参考</span>
      <span id="snapshot" class="snapshot">等待查询</span>
    </section>
    <section class="role-bar"><div id="role-tabs" class="segmented" role="group" aria-label="查看岗位"></div><span class="session-identity"><i data-lucide="user-round"></i><span id="identity-name">身份待确认</span></span></section>
    <div id="assign-view" class="workbench">
      <aside id="task-pane" class="task-pane" aria-label="需求列表">
        <div class="list-heading"><h2>需求列表 <span id="task-count" class="muted"></span></h2></div>
        <div class="list-tools"><label class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="搜索名称或需求 ID" aria-label="搜索需求"></label><button id="time-sort" class="icon-button" type="button" title="截止时间：由近到远" aria-label="截止时间：由近到远"><i data-lucide="arrow-up-narrow-wide"></i></button></div>
        <div id="task-list"></div>
      </aside>
      <section id="detail-pane" class="detail-pane" aria-label="人员分配分析"><div id="task-detail"></div></section>
    </div>
    <footer class="page-footer"><span>EA · 分配参考</span><span>v0.2.2 · 只读</span></footer>
  </main>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
